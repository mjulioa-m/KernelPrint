apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kernelprint.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kernelprint.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kernelprint.name" . }}
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5294
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: KernelPrint__Security__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "kernelprint.fullname" . }}-secrets
                  key: apiKey
            {{- if .Values.secrets.adminApiKey }}
            - name: KernelPrint__Admin__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "kernelprint.fullname" . }}-secrets
                  key: adminApiKey
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
